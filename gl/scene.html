// ---------- luzes compartilhadas (bulbos) ----------
const NBMAX=28;

    side:THREE.DoubleSide,

    fragmentShader:`precision highp float;

const wall=new THREE.Mesh(new THREE.PlaneGeometry(60,40),new THREE.ShaderMaterial({uniforms:{uTime:{value:0},uWin:{value:1},uWarm:{value:0},uTreeX:{value:0},uPulse:{value:0}},

box(4.2,.7,1.6,0,.55,0);box(4.2,1.2,.5,0,1.15,-.55);box(.5,1.0,1.6,-2.1,.85,0);box(.5,1.0,1.6,2.1,.85,0);box(1.7,.28,1.3,-1,.98,.1);box(1.7,.28,1.3,1,.98,.1);

// ---------- árvores ----------
let GOOD,BAD,P,star,starMat,orn,ornMeta,cord,cordGeo,cordCount,fest,festCount,gifts=[],skirt,lightPts,reflPts,bulbLocal,starGlow,pisca,piscaPts,burst;

  const r=rng(11);ornMeta=[];for(let i=0;i<no;i++){const y=.8+r()*3.0;const a=r()*Math.PI*2;const rr=surfR(y)+.08+r()*.04;const c=[CORES[0],CORES[2],new THREE.Color(.9,.85,.75),CORES[2],CORES[1]][i%5];
    ornMeta.push({p:new THREE.Vector3(Math.cos(a)*rr,y,Math.sin(a)*rr),t:r(),s:.8+r()*.6});orn.setColorAt(i,c);}

  // estrela
  const sh=new THREE.Shape();for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5;const rr=i%2?0.15:.36;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?sh.lineTo(x,y):sh.moveTo(x,y);}sh.closePath();

  burst=glowPoints(140,34);scene.add(burst);
  // árvore ruim (abertura): torta, rala, seca
  BAD=buildTree({tiers:4,wide:.82,droop:.5,dry:.55,holes:.34,zig:1.4,seed:4});BAD.g.scale.setScalar(.95);BAD.g.position.set(0,0,0);BAD.g.rotation.z=.13;scene.add(BAD.g);
  // fio de pisca (abertura)
  piscaPts=glowPoints(15,120);piscaPts.material.uniforms.uCore.value=1;scene.add(piscaPts);
  pisca=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0x3c5a4a}));scene.add(pisca);
  bulbU.uNB.value=nb+1;
}

const comp=new EffectComposer(renderer);comp.setSize(RW,RH);comp.setPixelRatio(1);
comp.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(RW/2,RH/2),.55,.55,.78);comp.addPass(bloom);
comp.addPass(new OutputPass());
const grade=new ShaderPass({uniforms:{tDiffuse:{value:null},uTime:{value:0},uRes:{value:new THREE.Vector2(RW,RH)},uFlash:{value:0},uSeed:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`precision highp float;varying vec2 vUv;uniform sampler2D tDiffuse;uniform float uTime,uFlash,uSeed;uniform vec2 uRes;
  float h(vec2 p){p=fract(p*vec2(443.8,441.4));p+=dot(p,p+19.19);return fract(p.x*p.y);}
  void main(){vec2 c=vUv-.5;float r2=dot(c,c);vec2 off=c*r2*.020;
   vec3 col=vec3(texture2D(tDiffuse,vUv+off).r,texture2D(tDiffuse,vUv).g,texture2D(tDiffuse,vUv-off).b);
   float l=dot(col,vec3(.299,.587,.114));
   col=mix(col,col*vec3(.92,1.0,.97)+vec3(0.,.012,.008),1.-smoothstep(0.,.35,l)); // sombras verde-azuladas
   col=mix(col,col*vec3(1.05,1.0,.93),smoothstep(.45,1.,l)); // luzes quentes
   col=pow(col,vec3(.97)); col*=1.+uFlash*.35; col+=uFlash*vec3(.15,.1,.03);
   float v=smoothstep(.95,.30,length(c*vec2(1.0,.72)));col*=mix(.55,1.,v);
   float gr=(h(vUv*uRes+fract(uTime*61.)*37.+uSeed)-.5)*.045+(h(vUv*uRes*.5+uTime)-.5)*.02;col+=gr*(1.-l*.6);
   gl_FragColor=vec4(col,1.);}`});
comp.addPass(grade);

const tmpv=new THREE.Vector3(), dummy=new THREE.Object3D();
window.setup=(p)=>{init(p);return true;};
window.draw=(t)=>{
  const T=P.T, nb=P.nb, DUR=P.dur;
  // câmera: dolly lento + vai e vem
  const zc=D0-1.3*seg(t,0,DUR)+.25*Math.sin(t*.35), xc=.16*Math.sin(t*.43), yc=2.83+.08*Math.sin(t*.31);
  const sh=180*ease(seg(t,T.dif,T.dif+1.1));
  cam.position.set(xc,yc,zc);cam.lookAt(xc*.2,yc,0);
  cam.setViewOffset(1080,1920,sh,0,1080,1920);
  bulbU.uTime.value=t;
  const t0=T.combinando-.5,t1=T.combinando+1.1;
  // ---- árvore velha / pisca ----
  const dis=ease(seg(t,T.dif-.1,T.dif+.9));
  BAD.g.visible=dis<.98; BAD.g.position.x=0; BAD.g.scale.setScalar(.95);
  BAD.tiers.forEach(m=>m.material.uniforms.uDissolve.value=dis*.9);BAD.trunk.visible=dis<.5;
  // luzes velhas: contam no uniform só p/ árvore nova; árvore ruim sem bulbos
  // ---- árvore nova ----
  const gm=GOOD.g;gm.rotation.y=.35*Math.sin(t*.25)+(t-T.monta)*.12;
  const asm=P.esc;
  GOOD.tiers.forEach((m,i)=>{const ts=T.monta+i*.13;const k=seg(t,ts,ts+.55);m.visible=t>=ts;m.position.y=TB(i)+(1-eob(k))*5.5;m.scale.setScalar(.6+.4*ease(k)); });
  GOOD.trunk.visible=t>=T.monta-.1;GOOD.trunk.scale.y=ease(seg(t,T.monta-.1,T.monta+.4));
  skirt.visible=t>=T.monta+.7;skirt.scale.setScalar(ease(seg(t,T.monta+.7,T.monta+1.3)));
  const ready=t>=T.monta; gm.visible=t>=T.monta-.1;
  gm.updateMatrixWorld(true);
  // cord & bulbos
  const kc=ease(seg(t,t0,t1)); cord.geometry.setDrawRange(0,Math.floor(kc*cordCount/3)*3);cord.visible=kc>0;
  if(fest){const kf=ease(seg(t,t1-.1,t1+.7));fest.geometry.setDrawRange(0,Math.floor(kf*festCount/3)*3);}
  for(let j=0;j<nb;j++){const tj=t0+.05+j*(t1-t0)/nb;const on=t>=tj?(1+.55*Math.exp(-(t-tj)*6)):0;
    const tw=.9+.1*Math.sin(t*(3+j*.37)+j*1.9);bulbU.uBOn.value[j]=on*tw*(P.gain||1);
    tmpv.copy(bulbLocal[j]);gm.localToWorld(tmpv);bulbU.uBP.value[j].copy(tmpv);bulbU.uBC.value[j].copy(CORES[j%5]);
    setPt(lightPts,j,tmpv.x,tmpv.y,tmpv.z,CORES[j%5],on*tw*.95,on?.75:0);
    setPt(reflPts,j,tmpv.x,-tmpv.y-.05,tmpv.z,CORES[j%5],on*tw*.22,1.6);}
  // estrela
  const ks=eob(seg(t,t1-.2,t1+.5));star.visible=ks>0;star.scale.setScalar(Math.max(.001,ks));star.rotation.y=t*.9;
  const sOn=ks>.3?1:0;tmpv.set(0,4.78+.2,0);gm.localToWorld(tmpv);
  bulbU.uBP.value[nb].copy(tmpv);bulbU.uBC.value[nb].set(1,.76,.3);bulbU.uBOn.value[nb]=sOn*2.4*ks*(P.gain||1);
  setPt(lightPts,nb,tmpv.x,tmpv.y,tmpv.z,new THREE.Color(1,.8,.35),ks*.6,1.6);
  setPt(starGlow,0,tmpv.x,tmpv.y,tmpv.z,new THREE.Color(1,.72,.28),ks*.16*(.9+.1*Math.sin(t*5)),1.6);
  setPt(starGlow,1,tmpv.x,-tmpv.y,tmpv.z,new THREE.Color(1,.72,.28),ks*.06,1.4);
  for(let j=nb+1;j<nb+4;j++)setPt(lightPts,j,0,-50,0,CORES[0],0,0),setPt(reflPts,j,0,-50,0,CORES[0],0,0);
  flush(lightPts);flush(reflPts);flush(starGlow);
  // bolas
  for(let i=0;i<ornMeta.length;i++){const m=ornMeta[i];const ts=t0+.25+m.t*(t1-t0+.5);const k=eob(seg(t,ts,ts+.35));dummy.position.copy(m.p);dummy.scale.setScalar(Math.max(.0001,k*m.s));dummy.updateMatrix();orn.setMatrixAt(i,dummy.matrix);}
  orn.instanceMatrix.needsUpdate=true;
  gifts.forEach(g=>{const ts=t1+.2+g.userData.t*.18;const k=eob(seg(t,ts,ts+.45));g.visible=t>=ts;g.scale.setScalar(Math.max(.001,k));});
  // ---- pisca velho ----
  const fall=Math.max(0,t-(T.dif-.2));const pv=t<T.dif+1.2;piscaPts.visible=pv;pisca.visible=pv;
  const pp=[];for(let j=0;j<15;j++){const u=(j-7)/7;const x=u*7.2;const y=4.4+.0-1.05*(1-u*u)-fall*fall*9;
    const dead=(j%3===1);let flick=dead?0:(rngS(Math.floor(t*12)+j*7)>.5?1:.15);if(t<T.queimado)flick=flick||(j%4===0?1:flick);
    if(t>T.queimado+.25)flick=flick*(j%4===0?0:flick);
    let a=flick*(1-ease(seg(t,T.dif-.2,T.dif+.5)));
    if(j===6&&t>T.queimado&&t<T.queimado+.18)a=3;
    setPt(piscaPts,j,x,y,.9,CORES[j%5],a*.9,1);pp.push(new THREE.Vector3(x,y,.9));}
  flush(piscaPts);pisca.geometry.setFromPoints(pp);pisca.material.opacity=1;pisca.material.transparent=true;pisca.material.opacity=1-ease(seg(t,T.dif-.2,T.dif+.5));
  // ---- explosão de brilho em "dentro do orçamento" ----
  const kb=t-T.orcamento;for(let i=0;i<140;i++){const r=rngS(i*13+1),r2=rngS(i*7+3),r3=rngS(i*5+9);
    if(kb>0&&kb<1.8){const a=r*Math.PI*2,sp=1.5+r2*3.5;const x=Math.cos(a)*sp*kb*.9,y=3+Math.sin(a)*sp*kb*.9-kb*kb*.8;setPt(burst,i,x,y,1.2,CORES[i%5],Math.max(0,1-kb/1.8)*.85,.6+r3*.8);}else setPt(burst,i,0,-50,0,CORES[0],0,0);}
  flush(burst);
  // ---- ambiente ----
  const warm=ease(seg(t,t0,t1+.5))*(P.gain||1);const pulse=Math.exp(-Math.max(0,t-T.orcamento)*2.2)*(t>=T.orcamento?1:0);
  const wu=wall.material.uniforms;wu.uTime.value=t;wu.uWarm.value=warm;wu.uPulse.value=pulse;wu.uWin.value=ease(seg(t,T.dif-.3,T.dif+.9))*(1-.45*seg(t,T.item,T.item+.8));wu.uTreeX.value=0;
  const fu=floorMat.uniforms;fu.uWarm.value=warm;fu.uPulse.value=pulse;fu.uTime.value=t;
  sofa.visible=t>=T.dif+.3;sofa.position.x=6.3;
  treeLight.intensity=warm*7*(1+pulse*.8)*(P.gain||1);
  snow.material.uniforms.uTime.value=t;bokeh.material.uniforms.uTime.value=t;bokeh.material.uniforms.uGain.value=.55+warm*.9;bokeh.material.uniforms.uWarm.value=warm;
  starMat.emissiveIntensity=2.2+.4*Math.sin(t*4)+pulse*2;
  grade.uniforms.uTime.value=t;grade.uniforms.uFlash.value=(t>T.queimado&&t<T.queimado+.15?1:0)*.9+pulse*.5;
  bloom.strength=.45+.25*warm+pulse*.5;
  comp.render();
};
function rngS(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
window.ready=true;
</script></body></html>
